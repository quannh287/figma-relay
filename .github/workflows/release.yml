name: release

# release-please keeps a release PR open; merging it tags vX.Y.Z, then the
# publish job builds the binaries, attaches plugin.zip and publishes to npm.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: go test ./...
      - run: ./npm/build.sh

      - name: Attach plugin.zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd plugin && zip -r ../plugin.zip .)
          gh release upload "${{ needs.release-please.outputs.tag }}" plugin.zip --clobber

      # Platform packages first: the launcher's optionalDependencies pin this
      # exact version, so publishing it before them would ship a broken install.
      - name: Publish platform packages to npm
        run: |
          for d in npm/platform/*/; do
            npm publish --provenance --access public "$d"
          done

      - name: Publish launcher to npm
        working-directory: npm
        run: npm publish --provenance
