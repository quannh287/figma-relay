name: ci

# No `push: main`: PRs are built on refs/pull/N/merge, so a merge would re-test
# an identical tree. release.yml re-runs the tests before it publishes.
on:
  pull_request:
    # Everything this job actually checks. Docs, skills and the README cannot
    # break it, so they do not get a runner.
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - "plugin/**"
      - "npm/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# A new commit on a PR makes the run for the previous one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race ./...
      # Nothing but Figma and npx ever run this JS, so catch syntax errors here.
      - name: Check shipped JS syntax
        run: |
          node --check plugin/code.js
          node --check npm/run.js
          awk '/<script>/{f=1;next}/<\/script>/{f=0}f' plugin/ui.html > "$RUNNER_TEMP/ui.js"
          node --check "$RUNNER_TEMP/ui.js"
