name: ci

# No `push: main`: PRs are built on refs/pull/N/merge, so a merge would re-test
# an identical tree. release.yml re-runs the tests before it publishes.
on:
  pull_request:
  workflow_dispatch:

# A new commit on a PR makes the run for the previous one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race ./...
      # Figma is the only thing that runs the plugin, so catch syntax errors here.
      - name: Check plugin JS syntax
        run: |
          node --check plugin/code.js
          awk '/<script>/{f=1;next}/<\/script>/{f=0}f' plugin/ui.html > "$RUNNER_TEMP/ui.js"
          node --check "$RUNNER_TEMP/ui.js"
